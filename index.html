<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="دليل محتويات دواليب مختبر العلوم — مدرسة الشيخ أحمد بن عبدالله الكندي">
<meta name="theme-color" content="#0B3A63">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 48 48%27%3E%3Crect width=%2748%27 height=%2748%27 rx=%2712%27 fill=%27%230B3A63%27/%3E%3Cg transform=%27translate(12 12)%27 fill=%27none%27 stroke=%27%23fff%27 stroke-width=%271.8%27%3E%3Cellipse cx=%2712%27 cy=%2712%27 rx=%2711%27 ry=%274.3%27/%3E%3Cellipse cx=%2712%27 cy=%2712%27 rx=%2711%27 ry=%274.3%27 transform=%27rotate(60 12 12)%27/%3E%3Cellipse cx=%2712%27 cy=%2712%27 rx=%2711%27 ry=%274.3%27 transform=%27rotate(120 12 12)%27/%3E%3C/g%3E%3Ccircle cx=%2724%27 cy=%2724%27 r=%272%27 fill=%27%2322B8CF%27/%3E%3C/svg%3E">
<title>مختبر العلوم — مدرسة الشيخ أحمد بن عبدالله الكندي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
:root{
  --bg:#F4F8FB; --card:#fff; --ink:#0E2233; --muted:#4F6475; --line:#DCE6EE; --line2:#EAF0F5;
  --blue:#0B5FA5; --deep:#0B3A63; --cyan:#22B8CF; --soft:#E3EFF8; --red:#B42318; --green:#0F766E;
  --head:"Readex Pro",sans-serif; --body:"IBM Plex Sans Arabic",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--body);background:var(--bg);color:var(--ink);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
input::placeholder,textarea::placeholder{color:#6B7F8F}
.wrap{max-width:980px;margin:0 auto;padding:0 16px}
.ib{display:inline-flex;align-items:center;justify-content:center;flex:none}
.h{font-family:var(--head)}

/* header */
.top{background:var(--deep);color:#fff;position:relative;overflow:hidden;padding:16px 0 46px}
.top .bgsvg{position:absolute;inset:0;pointer-events:none}
.top .row{display:flex;align-items:center;gap:12px;position:relative}
.top .eyebrow{font-size:12px;font-weight:600;letter-spacing:1.5px;color:var(--cyan)}
.top .school{font-size:13px;color:#CFE3F2}
.top .spacer{flex:1}
.navbtn{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.1);border:1px solid rgba(127,196,232,.35);color:#fff;border-radius:12px;padding:0 14px;min-height:42px;font-size:13px;white-space:nowrap}
.top .title{position:relative;margin-top:18px}
.top h1{margin:0;font-family:var(--head);font-weight:700;font-size:34px;line-height:1.2}
.top .lead{font-size:14px;color:#CFE3F2;margin-top:4px}
.strip{display:flex;gap:8px;margin-top:14px;position:relative;flex-wrap:wrap}
.strip span{width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.1);border:1px solid rgba(127,196,232,.35)}
.draft{background:#FFF7E0;color:#6B4A00;font-size:13px;text-align:center;padding:7px 12px;border-bottom:1px solid #F1DEAA}

main{margin-top:-24px;position:relative;z-index:1;padding-bottom:120px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 6px 18px rgba(11,58,99,.06)}

/* periodic tile */
.ptile{border-radius:12px;background:var(--soft);border:1.5px solid var(--blue);display:flex;flex-direction:column;justify-content:space-between;padding:6px 8px;flex:none}
.ptile .n{line-height:1.2;font-size:11px;font-weight:600;color:var(--blue);direction:ltr;text-align:left}
.ptile .b{font-family:var(--head);font-weight:700;line-height:1;color:var(--deep);text-align:center}
.ptile .l{line-height:1.2;font-size:10px;color:var(--blue);text-align:center}
.ptile.w{background:#fff;border:0}

/* home */
.cabs{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.cab{display:flex;gap:14px;align-items:center;padding:12px;transition:transform .15s}
.cab:hover{transform:translateY(-2px)}
.cab .info{flex:1;display:flex;flex-direction:column;gap:8px;min-width:0}
.cab .name{font-family:var(--head);font-size:18px;font-weight:600}
.minis{display:flex;flex-wrap:wrap;gap:5px}
.mini{width:28px;height:28px;border-radius:8px}
.avail{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--green)}
.hint{display:flex;gap:12px;align-items:center;padding:12px 14px;background:#fff;border:1px dashed #9CC3E0;border-radius:16px;margin-top:12px;font-size:13px;color:var(--muted)}
.hint .ib{width:40px;height:40px;border-radius:12px;background:var(--soft)}

/* cabinet */
.hero{padding:14px 16px;display:flex;align-items:center;gap:14px}
.hero h2{margin:0;font-family:var(--head);font-size:26px;font-weight:700;line-height:1.25}
.hero .sub{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.tools{margin-top:12px;padding:12px;display:grid;grid-template-columns:minmax(0,1fr);gap:10px;position:sticky;top:8px;z-index:5}
.search{min-width:0;display:flex;align-items:center;gap:8px;background:var(--bg);border-radius:14px;padding:0 14px;min-height:46px}
.search input{border:0;background:transparent;outline:0;padding:10px 0;flex:1;min-width:0;font-size:15px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:0 13px;min-height:38px;font-size:13px;font-weight:600;white-space:nowrap;border:1px solid transparent}
.chip small{opacity:.75;font-size:12px}
.list{margin-top:6px;display:grid;gap:8px}
.sec{display:flex;align-items:center;gap:10px;margin:14px 2px 2px}
.sec .ib{width:30px;height:30px;border-radius:9px}
.sec .t{font-family:var(--head);font-size:16px;font-weight:600}
.sec .ln{flex:1;height:1px;background:var(--line)}
.sec .c{font-size:12px;color:var(--muted)}
.item{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:14px;box-shadow:none}
.item .ico{width:38px;height:38px;border-radius:10px}
.item .body{flex:1;min-width:0}
.item .name{font-size:15px;font-weight:600;line-height:1.45}
.item .meta{font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.qty{flex:none;min-width:56px;display:flex;flex-direction:column;align-items:center;background:var(--bg);border-radius:10px;padding:4px 6px}
.qty b{font-family:var(--head);font-size:19px;font-weight:700;line-height:1.2;color:var(--blue)}
.qty span{font-size:11px;color:var(--muted)}
.tag{font-size:11px;border-radius:999px;padding:2px 8px;font-weight:600}
.empty{padding:44px 16px;text-align:center;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:10px}
.fabbar{position:fixed;bottom:0;left:0;right:0;z-index:20;background:#fff;border-top:1px solid var(--line);padding:12px 16px calc(14px + env(safe-area-inset-bottom))}
.fab{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;max-width:560px;margin:0 auto;border:0;background:var(--blue);color:#fff;border-radius:14px;min-height:52px;font-size:15px;font-weight:600}

/* sheet */
.overlay{position:fixed;inset:0;background:rgba(11,37,64,.55);z-index:50;display:none;align-items:flex-end;justify-content:center}
.overlay.show{display:flex}
.sheet{background:#fff;width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:12px 20px 24px;max-height:92vh;overflow:auto;animation:up .22s ease}
@media(min-width:700px){.overlay{align-items:center}.sheet{border-radius:24px}}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.grab{width:44px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 14px}
.shead{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.shead .ib{width:48px;height:48px;border-radius:14px;background:var(--soft)}
.shead h3{margin:0;font-family:var(--head);font-size:21px;font-weight:700}
.shead p{margin:0;font-size:13px;color:var(--muted)}
.field{display:grid;gap:6px;margin-bottom:14px}
.field label{font-size:13px;font-weight:600}
.inp{width:100%;border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--bg);outline:0;font-size:15px}
.inp:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--soft);background:#fff}
textarea.inp{resize:none;line-height:1.7}
.btn{border:0;border-radius:14px;min-height:48px;padding:0 18px;font-weight:600;background:var(--blue);color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.sec{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:#fff;color:var(--red);border:1px solid var(--line)}
.btn.sm{min-height:40px;padding:0 14px;font-size:13px;border-radius:12px}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px}
.btns .grow{flex:1}
.errtxt{font-size:13px;color:var(--red);margin-top:8px}
.done-box{text-align:center;padding:26px 0 8px;display:flex;flex-direction:column;align-items:center;gap:10px}
.done-box h3{margin:0;font-family:var(--head);font-size:24px}
.done-box p{margin:0;color:var(--muted);font-size:14px}
.seg2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* admin */
.kpis{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px}
.kpi{flex:1 1 160px;padding:14px 16px;display:flex;align-items:center;gap:12px}
.kpi .ib{width:44px;height:44px;border-radius:13px}
.kpi b{display:block;font-family:var(--head);font-size:26px;line-height:1.15}
.kpi span{font-size:13px;color:var(--muted)}
.tabs{display:flex;gap:4px;padding:6px;overflow-x:auto;scrollbar-width:none;margin-top:12px}
.tabs button{flex:none;border:0;background:transparent;border-radius:12px;padding:0 14px;min-height:44px;font-weight:600;color:var(--muted);display:flex;gap:8px;align-items:center}
.tabs button.on{background:var(--soft);color:var(--blue)}
.badge{background:var(--cyan);color:#0B2540;border-radius:99px;font-size:11px;font-weight:700;padding:0 7px;line-height:18px}
.panel{margin-top:12px}
.bar-tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px}
.bar-tools .search{flex:1;min-width:200px}
.sel{border:1px solid var(--line);border-radius:12px;min-height:44px;padding:0 10px;background:#fff}
.arow{display:grid;grid-template-columns:1fr auto auto auto;gap:10px;align-items:center;padding:10px 14px;border-top:1px solid var(--line2)}
.arow:first-child{border-top:0}
.arow .who{display:flex;align-items:center;gap:10px;min-width:0}
.arow .ico{width:38px;height:38px;border-radius:10px}
.arow .name{font-weight:600;font-size:15px}
.arow .meta{font-size:12px;color:var(--muted)}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.stepper button{border:0;background:var(--bg);width:40px;height:40px;font-size:19px;line-height:1}
.stepper input{width:52px;border:0;text-align:center;height:40px;outline:0;font-family:var(--head);font-weight:700;color:var(--blue);font-size:16px}
.stepper input.z{color:var(--red)}
.stsel{border:1px solid var(--line);border-radius:12px;min-height:40px;padding:0 8px;background:#fff;font-size:13px}
.iconbtn{border:0;background:transparent;width:40px;height:40px;border-radius:12px;color:var(--muted)}
.iconbtn:hover{background:var(--bg);color:var(--ink)}
@media(max-width:640px){.arow{grid-template-columns:1fr auto}.arow .stsel{grid-column:1;justify-self:start}.arow .iconbtn{justify-self:end}}
.msg{padding:14px 16px;border-top:1px solid var(--line2);display:grid;gap:8px}
.msg:first-child{border-top:0}
.msg.new{background:#F7FBFE}
.msg .mh{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.msg .dot{width:8px;height:8px;border-radius:50%;background:var(--cyan)}
.msg .time{font-size:12px;color:var(--muted);margin-inline-start:auto}
.msg .txt{font-size:14px;line-height:1.75;white-space:pre-wrap}
.qrgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;padding:16px}
.qrcard{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:#fff;display:flex;flex-direction:column;break-inside:avoid}
.qrcard .qtop{background:var(--deep);color:#fff;padding:12px 14px;display:flex;align-items:center;gap:10px;position:relative;overflow:hidden}
.qrcard .qtop b{font-family:var(--head);font-size:16px}
.qrcard .qtop small{display:block;font-size:11px;color:#CFE3F2}
.qrcard .qbody{padding:14px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.qrcard .qname{display:flex;align-items:center;gap:10px}
.qrcard .qname h4{margin:0;font-family:var(--head);font-size:22px;color:var(--deep)}
.qrbox{position:relative;padding:12px;border-radius:14px;box-shadow:0 6px 20px rgba(11,58,99,.12);background:#fff}
.qrbox svg.code{width:170px;height:170px;display:block}
.qrbox i{position:absolute;width:18px;height:18px;border-color:var(--cyan);border-style:solid;border-width:0}
.qrcard .scan{font-family:var(--head);font-size:14px;font-weight:600;display:flex;align-items:center;gap:6px}
.qrcard .tech{font-size:11px;color:var(--muted);border-top:1px solid var(--line);padding-top:8px;width:100%}
.log{padding:10px 14px;border-top:1px solid var(--line2);font-size:14px;display:flex;gap:10px}
.log:first-child{border-top:0}
.log .t{color:var(--muted);font-size:12px;white-space:nowrap}
.login{max-width:380px;margin:0 auto;padding:24px;text-align:center}
.login .ib{width:56px;height:56px;border-radius:16px;background:var(--soft);margin:0 auto 10px}
.login h2{margin:0 0 4px;font-family:var(--head)}
.pin{letter-spacing:10px;text-align:center;font-size:22px}
.note{font-size:13px;color:var(--muted);padding:0 16px 14px}
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%) translateY(-90px);background:var(--deep);color:#fff;padding:10px 18px;border-radius:12px;z-index:99;transition:.25s;font-size:14px}
.toast.show{transform:translateX(-50%) translateY(0)}
footer{display:flex;align-items:center;justify-content:center;gap:10px;padding:16px;border-top:1px solid var(--line);background:#fff;margin-top:24px}
footer .ib{width:36px;height:36px;border-radius:50%;background:var(--soft)}
footer small{display:block;font-size:11px;color:var(--muted)}
footer b{font-family:var(--head);font-size:14px;font-weight:600}
body.has-fab footer{padding-bottom:96px}
@media print{
  body *{visibility:hidden}
  #printArea,#printArea *{visibility:visible}
  #printArea{position:absolute;inset:0}
  .qrbox{box-shadow:none}
  .noprint{display:none!important}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body{background:#fff}
  body.print-one .qrcard:not(.printing){display:none}
  body.print-one .qrgrid{display:block;padding:0}
  body.print-one .qrcard.printing{width:13cm;margin:1.5cm auto 0;border-width:2px}
  body.print-one .qrcard.printing .qrbox svg.code{width:8cm;height:8cm}
  body.print-one .qrcard.printing .qname h4{font-size:30px}
}
</style>
</head>
<body>
<header class="top">
  <svg class="bgsvg" aria-hidden="true" width="100%" height="100%"><defs><pattern id="gp" width="18" height="18" patternUnits="userSpaceOnUse"><path d="M18 0H0V18" fill="none" stroke="#7FC4E8" stroke-width="0.8" opacity="0.18"></path></pattern></defs><rect width="100%" height="100%" fill="url(#gp)"></rect></svg>
  <svg class="bgsvg" aria-hidden="true" viewBox="0 0 190 170" width="190" height="170" fill="none" style="inset:auto;left:-40px;bottom:-30px;opacity:.45"><g stroke="#22B8CF" stroke-width="2" stroke-linecap="round"><path d="M70 40l30-17 30 17v35l-30 17-30-17z"></path><path d="M78 45l22-12.5M122 45v26M78 70l22 12.5" opacity="0.6"></path><path d="M130 40l26-15M100 92v30M70 75l-26 15M156 25l20 8M100 122l-18 12M100 122l18 12"></path></g><g fill="#22B8CF"><circle cx="156" cy="25" r="7"></circle><circle cx="44" cy="90" r="8"></circle><circle cx="82" cy="134" r="5"></circle><circle cx="118" cy="134" r="5"></circle><circle cx="176" cy="33" r="4"></circle></g></svg>
  <div class="wrap">
    <div class="row">
      <svg role="img" aria-label="شعار مختبر العلوم" width="46" height="46" viewBox="0 0 48 48" fill="none" style="flex:none"><rect x="1" y="1" width="46" height="46" rx="12" fill="#FFFFFF" fill-opacity="0.12" stroke="#22B8CF" stroke-width="1.5"></rect><g transform="translate(12 12)" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="1.6" fill="#22B8CF" stroke="#22B8CF"></circle><ellipse cx="12" cy="12" rx="11" ry="4.3"></ellipse><ellipse cx="12" cy="12" rx="11" ry="4.3" transform="rotate(60 12 12)"></ellipse><ellipse cx="12" cy="12" rx="11" ry="4.3" transform="rotate(120 12 12)"></ellipse></g></svg>
      <div>
        <div class="eyebrow" dir="ltr" style="text-align:right">SCIENCE LAB</div>
        <div class="school">مدرسة الشيخ أحمد بن عبدالله الكندي</div>
      </div>
      <div class="spacer"></div>
      <a class="navbtn" id="navBtn" href="#admin">لوحة التحكم</a>
    </div>
    <div class="title" id="topTitle"></div>
  </div>
</header>
<main class="wrap" id="app"></main>
<footer><span class="ib" id="ftIcon"></span><div><small>فني المختبر</small><b>الأستاذ محمد بن عبدالله العبادي</b></div></footer>

<div class="overlay" id="ov"><div class="sheet" id="sheet"></div></div>
